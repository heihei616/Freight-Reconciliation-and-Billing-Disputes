name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  # 测试不调用真实模型；关掉限流避免用例之间互相影响
  RATE_LIMIT_ENABLED: "0"
  LOG_MASKING: "1"

jobs:
  quality:
    name: 规范与文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-build-isolation

      - name: Ruff 静态检查
        run: ruff check src tests examples scripts

      - name: Ruff 格式检查
        run: ruff format --check src tests examples scripts

      - name: 仓库规范自检
        run: python scripts/check_repo.py

      - name: 文档与代码一致性
        run: python scripts/check_docs.py

      - name: 评测用例自检
        run: python scripts/check_cases.py

  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
          pip install -e . --no-build-isolation

      - name: 编译检查
        run: python -m compileall -q src tests examples scripts

      - name: 离线单元测试
        run: python -m unittest discover -s tests -v

      - name: 覆盖率统计
        if: matrix.python-version == '3.12'
        run: |
          coverage run -m unittest discover -s tests
          coverage report -m
          coverage xml

      - name: 上传覆盖率
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: 启动冒烟
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-build-isolation

      - name: 离线示例
        run: python examples/demo.py

      - name: 启动并检查健康接口
        run: |
          # 无密钥时自动走 mock，仍然验证建表、建索引、挂载路由的完整启动链路
          python -m logistics_agent.main > server.log 2>&1 &
          code="000"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "health=$code"
          cat server.log
          test "$code" = "200"

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore
