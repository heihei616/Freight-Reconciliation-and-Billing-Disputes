<svg viewBox="0 0 680 1104" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>运费对账与计费争议现状流程图（改造前）</title>
<desc>三条泳道（单据侧、计费侧、审批侧）纵向主流程：运单归集、重量核验、合同计费、差异确认、结算审批、在线确权，四个判断点各带转人工兜底，底部为争议反馈闭环。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="48" width="4" height="400" fill="#185FA5"/>
<rect x="40" y="448" width="4" height="332" fill="#0F6E56"/>
<rect x="40" y="780" width="4" height="232" fill="#534AB7"/>
<line x1="40" y1="448" x2="640" y2="448" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="40" y1="780" x2="640" y2="780" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="52" y="240" font-size="14" font-weight="500" fill="#0C447C">单据侧</text>
<text x="52" y="260" font-size="12" fill="#5F5E5A">林亦舟·录入</text>
<text x="52" y="278" font-size="12" fill="#5F5E5A">唐映秋·对账</text>
<text x="52" y="606" font-size="14" font-weight="500" fill="#085041">计费侧</text>
<text x="52" y="626" font-size="12" fill="#5F5E5A">秦芮·系统</text>
<text x="52" y="644" font-size="12" fill="#5F5E5A">唐映秋·核对</text>
<text x="52" y="888" font-size="14" font-weight="500" fill="#3C3489">审批侧</text>
<text x="52" y="908" font-size="12" fill="#5F5E5A">顾明岚·结算</text>
<text x="52" y="926" font-size="12" fill="#5F5E5A">傅景·审计</text>
<g>
<rect x="180" y="60" width="300" height="44" rx="8" fill="#185FA5" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="76" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">运输完成</text>
<text x="330" y="93" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">每月 2.8 万票</text>
</g>
<g>
<rect x="180" y="132" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="152" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">① 运单归集</text>
<text x="330" y="171" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">合同价·签收回执齐备</text>
</g>
<g>
<rect x="180" y="216" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="330" y="244" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">四类材料齐全·口径一致？</text>
</g>
<g>
<rect x="180" y="300" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="320" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② 重量核验</text>
<text x="330" y="339" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">实际 / 体积 / 保底重量</text>
</g>
<g>
<rect x="180" y="384" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="330" y="412" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">口径明确·说明清晰？</text>
</g>
<g>
<rect x="180" y="468" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="488" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">③ 合同计费</text>
<text x="330" y="507" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">发车时间 vs 签收时间</text>
</g>
<g>
<rect x="180" y="552" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="330" y="580" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">版本 / 时间口径冲突？</text>
</g>
<g>
<rect x="180" y="636" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="656" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">④ 差异确认</text>
<text x="330" y="675" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">理论账单 vs 承运商账单</text>
</g>
<g>
<rect x="180" y="720" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="330" y="748" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">存在超收 / 漏收差异？</text>
</g>
<g>
<rect x="180" y="804" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="824" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">⑤ 结算审批</text>
<text x="330" y="843" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">可重现 100% · 未授权扣费为零</text>
</g>
<g>
<rect x="180" y="888" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="908" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">⑥ 在线确权</text>
<text x="330" y="927" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">回传财务 ERP</text>
</g>
<g>
<rect x="180" y="972" width="300" height="44" rx="8" fill="#185FA5" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="994" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">本单结算完成</text>
</g>
<g>
<rect x="520" y="216" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="580" y="236" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">退回补件</text>
<text x="580" y="255" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">转人工</text>
</g>
<g>
<rect x="520" y="384" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="580" y="404" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">查合同</text>
<text x="580" y="423" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">说明不随单</text>
</g>
<g>
<rect x="520" y="552" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="580" y="572" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">附两版本</text>
<text x="580" y="591" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">转审计</text>
</g>
<g>
<rect x="520" y="720" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="580" y="740" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">差异解释</text>
<text x="580" y="759" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">仅建议</text>
</g>
