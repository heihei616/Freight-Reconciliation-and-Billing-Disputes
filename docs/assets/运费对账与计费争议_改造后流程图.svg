<svg viewBox="0 0 680 1152" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>运费对账与计费争议 AI 数智流程图（改造后）</title>
<desc>四条泳道：采集侧（AI 自动归集）、计费侧（AI 规则引擎）、对账侧（AI 自动对账）、审批侧（人机协同）。紫色节点为 AI 介入，蓝色为人工环节，四个判断点保留转人工兜底，底部为争议复盘规则迭代闭环。</desc>
