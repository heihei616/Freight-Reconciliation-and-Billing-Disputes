[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-agent"
version = "1.3.0"
description = "物流费对账与计费争议智能体"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "logistics-agent contributors"}]
keywords = ["fastapi", "rag", "agent", "function-calling", "sse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "coverage>=7.6",
  "pre-commit>=3.8",
]

[project.scripts]
logistics-agent = "logistics_agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
logistics_agent = [
  "static/*.html",
  "static/*.css",
  "templates/*.html",
  "templates/admin/*.html",
]

# ---------------------------------------------------------------------------
# Ruff：一个工具同时覆盖 lint 与格式化，避免 black/isort/flake8 三件套
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples", "scripts"]
extend-exclude = ["data", "docs", ".venv"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle 错误
  "W",     # pycodestyle 警告
  "F",     # pyflakes：未使用导入、未定义变量
  "I",     # isort：导入排序
  "B",     # bugbear：常见逻辑陷阱
  "UP",    # pyupgrade：旧式写法
  "ASYNC", # 异步常见错误（如阻塞事件循环）
  "RUF",   # ruff 自有规则
]
ignore = [
  "E501",   # 行宽交给 check_repo.py 的宽松阈值处理
  "B008",   # FastAPI 依赖注入必须在默认参数里调用 Depends
  "RUF001", # 中文注释里的全角标点是有意为之
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["logistics_agent"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# 覆盖率：只看 src，测试与示例不计入
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/logistics_agent"]
omit = ["*/static/*", "*/templates/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
