<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="物流费对账与计费争议轻量 MVP">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23167d74'/%3E%3Cpath d='M18 17h28v7H18zm0 12h28v7H18zm0 12h18v7H18z' fill='white'/%3E%3C/svg%3E">
  <title>物流费对账助手 · MVP</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #18212b;
      --muted: #687482;
      --line: #e4e8ed;
      --accent: #167d74;
      --accent-soft: #e9f5f2;
      --danger: #bf3f46;
      --danger-soft: #fff1f1;
      --success: #27745a;
      --success-soft: #edf7f1;
      --warning: #95651e;
      --shadow: 0 8px 28px rgba(23, 37, 51, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .topbar {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      font-weight: 800;
      font-size: 18px;
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .mvp-badge {
      padding: 3px 7px;
      border-radius: 5px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 11px;
      font-weight: 800;
    }
    .top-note { color: var(--muted); font-size: 12px; text-align: right; }
    .workspace {
      display: grid;
      grid-template-columns: 264px minmax(440px, 1fr) 330px;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 66px);
    }
    .panel {
      min-width: 0;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: var(--shadow);
    }
    .side-panel { padding: 16px 12px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 4px 12px;
    }
    .section-head h2, .section-head h3 { margin: 0; font-size: 14px; }
    .section-head span { color: var(--muted); font-size: 12px; }
    .bill-list { display: grid; gap: 9px; }
    .bill-item {
      width: 100%;
      padding: 13px;
      text-align: left;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      transition: border-color .15s, background .15s;
    }
    .bill-item:hover { border-color: #9fb9b5; }
    .bill-item.active { border-color: var(--accent); background: #f4faf8; }
    .bill-top, .bill-meta, .amount-line, .issue-head, .draft-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .bill-carrier { font-weight: 700; }
    .bill-no { margin: 8px 0; color: #3f4c59; font-size: 12px; word-break: break-all; }
    .bill-meta { color: var(--muted); font-size: 12px; }
    .tag {
      flex: none;
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border-radius: 5px;
      color: var(--muted);
      background: #f0f2f4;
      font-size: 11px;
      font-weight: 650;
    }
    .tag.fail { color: var(--danger); background: var(--danger-soft); }
    .tag.pass, .tag.confirmed { color: var(--success); background: var(--success-soft); }
    .tag.pending { color: var(--warning); background: #fff6e7; }
    .draft-section { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
    .empty { padding: 20px 6px; color: var(--muted); text-align: center; font-size: 12px; }
    .draft-item {
      width: 100%;
      margin-bottom: 8px;
      padding: 11px;
      text-align: left;
      color: var(--text);
      background: #fafbfb;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .draft-item small { display: block; margin-top: 7px; color: var(--muted); }
    .main-panel { padding: 22px; }
    .bill-heading { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
    .eyebrow { margin: 0 0 7px; color: var(--accent); font-size: 12px; font-weight: 750; }
    .bill-heading h2 { margin: 0; font-size: 20px; word-break: break-all; }
    .subline { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .charged-total { flex: none; text-align: right; }
    .charged-total span { display: block; color: var(--muted); font-size: 12px; }
    .charged-total strong { display: block; margin-top: 4px; font-size: 22px; }
    .verdict {
      margin: 20px 0;
      padding: 17px 18px;
      border: 1px solid;
      border-radius: 11px;
    }
    .verdict.fail { color: var(--danger); background: var(--danger-soft); border-color: #f1cccc; }
    .verdict.pass { color: var(--success); background: var(--success-soft); border-color: #cde7d9; }
    .verdict.warn { color: var(--warning); background: #fff8e9; border-color: #eddbb7; }
    .verdict-line { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .verdict-title { font-weight: 750; }
    .verdict p { margin: 8px 0 0; color: #4e5965; line-height: 1.65; font-size: 13px; }
    .delta { flex: none; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
    .delta small { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 500; text-align: right; }
    .primary {
      padding: 10px 16px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      font-weight: 700;
    }
    .primary:hover { background: #116a62; }
    .secondary {
      padding: 10px 16px;
      color: #35414d;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .verdict .primary { margin-top: 13px; }
    .review-flow { margin-top: 4px; }
    .review-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      margin-bottom: 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fafbfb;
    }
    .review-step.done { border-color: #cde7d9; background: #f2faf5; }
    .step-no {
      flex: none;
      width: 24px; height: 24px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: #fff; background: var(--accent);
      font-size: 12px; font-weight: 800;
    }
    .review-step .step-body { flex: 1; min-width: 0; }
    .review-step .step-title { font-weight: 700; font-size: 13px; }
    .review-step .step-meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .muted-hint { color: #a0a8b0; }
    .review-input {
      flex: none; width: 110px;
      padding: 7px 9px;
      border: 1px solid #d7dde3;
      border-radius: 7px;
      font-size: 12px;
      outline: none;
    }
    .review-input:focus { border-color: var(--accent); }
    .review-actions { flex: none; display: flex; gap: 6px; }
    .review-btn { padding: 7px 10px; font-size: 12px; }
    .draft-cta { margin-top: 12px; }
    .content-section { margin-top: 22px; }
    .content-section h3 { margin: 0 0 12px; font-size: 15px; }
    .issue-card { margin-bottom: 11px; padding: 15px; border: 1px solid var(--line); border-radius: 10px; }
    .issue-title { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-weight: 750; }
    .issue-delta { flex: none; color: var(--danger); font-size: 17px; font-weight: 800; }
    .issue-explain { margin: 11px 0; color: #3e4a56; line-height: 1.65; }
    .amount-line { flex-wrap: wrap; justify-content: flex-start; gap: 18px; color: var(--muted); font-size: 12px; }
    .amount-line strong { color: #35414d; }
    details { margin-top: 12px; }
    summary { color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 650; }
    .steps { margin: 10px 0 0; padding: 12px 12px 12px 30px; color: #53606d; background: #f7f9fa; border-radius: 8px; font-size: 12px; line-height: 1.8; }
    .policy-card { margin-bottom: 9px; padding: 13px; background: #f7f9fa; border-radius: 9px; }
    .policy-card strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .policy-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; white-space: pre-wrap; }
    .all-rows { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 12px; }
    .all-rows th, .all-rows td { padding: 10px 7px; border-bottom: 1px solid var(--line); text-align: right; }
    .all-rows th:first-child, .all-rows td:first-child, .all-rows th:nth-child(2), .all-rows td:nth-child(2) { text-align: left; }
    .all-rows th { color: var(--muted); font-weight: 600; }
    .qa-panel { display: flex; flex-direction: column; padding: 16px; }
    .qa-intro { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .messages { flex: 1; min-height: 180px; overflow: auto; }
    .message { margin-bottom: 12px; padding: 12px; border-radius: 10px; line-height: 1.7; font-size: 13px; white-space: pre-wrap; }
    .message.assistant { background: #f3f6f7; border-top-left-radius: 3px; }
    .message.user { margin-left: 28px; color: #fff; background: var(--accent); border-top-right-radius: 3px; }
    .citations { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .citation { padding: 3px 6px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; font-size: 10px; }
    .quick-title { margin: 8px 0; color: var(--muted); font-size: 11px; }
    .quick-list { display: grid; gap: 6px; }
    .quick {
      padding: 8px 10px;
      text-align: left;
      color: #45515d;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 12px;
    }
    .quick:hover { color: var(--accent); border-color: #a9c9c4; }
    .ask-form { display: flex; gap: 7px; margin-top: 13px; }
    .ask-form input {
      min-width: 0;
      flex: 1;
      padding: 10px 11px;
      border: 1px solid #d7dde3;
      border-radius: 8px;
      outline: none;
    }
    .ask-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .ask-form button { padding: 9px 13px; }
    .foot-note { margin: 12px 0 0; color: #8a939c; font-size: 10px; text-align: center; }
    .loading { padding: 40px 10px; color: var(--muted); text-align: center; }
    dialog {
      width: min(650px, calc(100vw - 32px));
      max-height: calc(100vh - 50px);
      padding: 0;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
    }
    dialog[open] { display: flex; flex-direction: column; overflow: hidden; }
    dialog::backdrop { background: rgba(20, 29, 37, .45); }
    .dialog-head { flex: none; display: flex; justify-content: space-between; gap: 16px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 18px; }
    .dialog-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .icon-button { padding: 3px 8px; color: var(--muted); background: transparent; border: 0; font-size: 22px; }
    .dialog-body { flex: 1; min-height: 0; padding: 20px 22px; overflow: auto; }
    .draft-amount { margin-bottom: 15px; padding: 13px; color: var(--danger); background: var(--danger-soft); border-radius: 9px; font-size: 22px; font-weight: 800; }
    .draft-body { margin: 0; color: #3f4b57; font: 13px/1.8 Inter, "PingFang SC", "Microsoft YaHei", sans-serif; white-space: pre-wrap; }
    .dialog-actions { flex: none; display: flex; justify-content: flex-end; gap: 9px; padding: 16px 22px; border-top: 1px solid var(--line); }
    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 25px;
      max-width: min(560px, calc(100vw - 30px));
      padding: 11px 17px;
      color: #fff;
      background: #26333f;
      border-radius: 8px;
      box-shadow: var(--shadow);
      transform: translateX(-50%);
    }
    .toast.error { background: #91383e; }
    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(160deg, #e8f1ee 0%, #f4f6f8 55%, #e7edf2 100%);
    }
    .login-card {
      width: min(460px, 100%);
      padding: 30px 28px 26px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 60px rgba(23, 37, 51, .14);
    }
    .login-brand { display: flex; align-items: center; gap: 12px; }
    .login-brand h1 { margin: 0; font-size: 19px; }
    .login-sub { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .login-form { display: grid; gap: 10px; margin-top: 20px; }
    .login-form input {
      padding: 11px 12px;
      border: 1px solid #d7dde3;
      border-radius: 8px;
      outline: none;
    }
    .login-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .login-btn { padding: 11px; }
    .login-error {
      margin-top: 12px;
      padding: 10px 12px;
      color: var(--danger);
      background: var(--danger-soft);
      border-radius: 8px;
      font-size: 12px;
    }
    .account-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .account-chip {
      padding: 10px 11px;
      text-align: left;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .account-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
    .account-chip strong { display: block; font-size: 13px; }
    .account-chip small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .user-chip { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .user-name { font-weight: 750; font-size: 13px; }
    .user-role { color: var(--muted); font-size: 11px; }
    .small-btn { padding: 7px 12px; font-size: 12px; }
    .perm-hint { color: var(--muted); font-size: 11px; }
    [hidden] { display: none !important; }
    @media (max-width: 1120px) {
      body { overflow: auto; }
      .workspace { height: auto; grid-template-columns: 240px minmax(0, 1fr); }
      .panel { max-height: none; }
      .qa-panel { grid-column: 1 / -1; min-height: 480px; }
    }
    @media (max-width: 760px) {
      .topbar { height: auto; padding: 14px 16px; }
      .top-note { display: none; }
      .workspace { grid-template-columns: 1fr; padding: 10px; }
      .main-panel { padding: 16px; }
      .bill-heading, .verdict-line { flex-direction: column; }
      .charged-total { text-align: left; }
      .delta small { text-align: left; }
      .qa-panel { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">账</div>
      <div>
        <h1>物流费对账助手 <span class="mvp-badge">MVP</span></h1>
        <p>制度问答 × 确定性核账 × 人工确认</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="top-note">金额由 domain.py 统一计算 · 争议单须人工确认<br>本地演示，不调用模型、不执行财务过账</div>
      <div class="user-chip">
        <span id="userName" class="user-name">未登录</span>
        <span id="userRole" class="user-role"></span>
      </div>
      <button id="logoutBtn" class="secondary small-btn" type="button" hidden>退出</button>
    </div>
  </header>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark" aria-hidden="true">账</div>
        <div>
          <h1>物流费对账助手 <span class="mvp-badge">MVP</span></h1>
        </div>
      </div>
      <p class="login-sub">基于六人访谈角色设置六类账号，权限对应三处人工审核点。<br>不同角色登录后可执行的操作不同。</p>
      <form id="loginForm" class="login-form" autocomplete="on">
        <input id="loginUser" name="username" placeholder="账号（如 guminglan）" autocomplete="username">
        <input id="loginPass" name="password" type="password" placeholder="口令" autocomplete="current-password">
        <button id="loginButton" class="primary login-btn" type="submit">登录</button>
      </form>
      <div id="loginError" class="login-error" hidden></div>
      <div class="quick-title">演示账号（点击直接登录）</div>
      <div id="accountChips" class="account-chips"></div>
    </div>
  </div>

  <div id="workspace" class="workspace" hidden>
    <aside class="panel side-panel" aria-label="账单与草稿">
      <div class="section-head"><h2>待核对账单</h2><span id="billCount">载入中</span></div>
      <div id="billList" class="bill-list"><div class="loading">正在读取账单…</div></div>
      <section class="draft-section">
        <div class="section-head"><h3>最近争议草稿</h3><span id="draftCount">0</span></div>
        <div id="draftList"><div class="empty">暂无草稿</div></div>
      </section>
    </aside>

    <main id="auditPanel" class="panel main-panel" aria-live="polite">
      <div class="loading">正在准备核对结果…</div>
    </main>

    <aside class="panel qa-panel" aria-label="制度问答">
      <div class="section-head"><h2>制度问答</h2><span>附条款出处</span></div>
      <p class="qa-intro">回答来自本地制度检索与当前账单事实；未命中时会明确说不知道。</p>
      <div id="messages" class="messages"></div>
      <div class="quick-title">快速提问</div>
      <div id="quickList" class="quick-list"></div>
      <form id="askForm" class="ask-form">
        <input id="questionInput" maxlength="500" autocomplete="off" placeholder="输入制度或账单问题" aria-label="输入问题">
        <button id="askButton" class="primary" type="submit">提问</button>
      </form>
      <p class="foot-note">轻量关键词检索，不生成未经制度支持的结论</p>
    </aside>
  </div>

  <dialog id="draftDialog" aria-labelledby="draftDialogTitle">
    <div class="dialog-head">
      <div><h2 id="draftDialogTitle">确认争议草稿</h2><p id="draftDialogMeta"></p></div>
      <button id="dialogClose" class="icon-button" type="button" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div id="draftAmount" class="draft-amount"></div>
      <div id="draftStatus"></div>
      <pre id="draftBody" class="draft-body"></pre>
    </div>
    <div class="dialog-actions">
      <button id="cancelDraft" class="secondary" type="button">取消草稿</button>
      <button id="confirmDraft" class="primary" type="button">确认提交复核</button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script>
    "use strict";
    const state = { bills: [], audits: {}, reviews: {}, current: null, audit: null, drafts: [], activeDraft: null, token: null, user: null };
    const byId = (id) => document.getElementById(id);

    function can(permission) {
      return !!(state.user && state.user.permissions && state.user.permissions.includes(permission));
    }

    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined && text !== null) element.textContent = String(text);
      return element;
    }

    function money(value, signed = false) {
      const number = Number(value || 0);
      const prefix = number < 0 ? "-" : (signed && number > 0 ? "+" : "");
      return prefix + "¥" + Math.abs(number).toLocaleString("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function plainAmount(value) {
      return Number(value || 0).toLocaleString("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    let toastTimer;
    function toast(message, isError = false) {
      const item = byId("toast");
      item.textContent = message;
      item.classList.toggle("error", isError);
      item.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { item.hidden = true; }, 3200);
    }

    async function api(path, options = {}) {
      const request = { ...options, headers: { ...(options.headers || {}) } };
      if (state.token) request.headers["Authorization"] = "Bearer " + state.token;
      if (request.body) request.headers["Content-Type"] = "application/json";
      const response = await fetch(path, request);
      if (response.status === 401 && state.token) {
        doLogout(true);
        throw new Error("登录已失效，请重新登录");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || data.message || `请求失败（${response.status}）`);
      return data;
    }

    function verdictTag(result) {
      if (!result) return node("span", "tag", "待核对");
      const text = result.verdict === "fail" ? `${result.issues.length} 处差异` :
        (result.verdict === "pass" ? "核对通过" : "需复核");
      return node("span", `tag ${result.verdict}`, text);
    }

    function renderBills() {
      byId("billCount").textContent = `${state.bills.length} 张`;
      const list = byId("billList");
      list.replaceChildren();
      state.bills.forEach((bill) => {
        const button = node("button", `bill-item${state.current === bill.bill_no ? " active" : ""}`);
        button.type = "button";
        button.setAttribute("aria-label", `核对账单 ${bill.bill_no}`);
        const top = node("div", "bill-top");
        top.append(node("span", "bill-carrier", bill.carrier), verdictTag(state.audits[bill.bill_no]));
        const number = node("div", "bill-no", bill.bill_no);
        const meta = node("div", "bill-meta");
        meta.append(node("span", "", bill.period), node("strong", "", money(bill.total_amount)));
        button.append(top, number, meta);
        button.addEventListener("click", () => selectBill(bill.bill_no));
        list.append(button);
      });
    }

    function statusLabel(status) {
      return { pending: "待确认", confirmed: "已确认", cancelled: "已取消" }[status] || status;
    }

    function renderDrafts() {
      byId("draftCount").textContent = String(state.drafts.length);
      const list = byId("draftList");
      list.replaceChildren();
      if (!state.drafts.length) {
        list.append(node("div", "empty", "暂无草稿"));
        return;
      }
      state.drafts.forEach((draft) => {
        const button = node("button", "draft-item");
        button.type = "button";
        const top = node("div", "draft-top");
        top.append(node("strong", "", draft.draft_id), node("span", `tag ${draft.status}`, statusLabel(draft.status)));
        const detail = node("small", "", `${draft.bill_no} · ${money(draft.amount)}`);
        button.append(top, detail);
        button.addEventListener("click", () => openDraft(draft));
        list.append(button);
      });
    }

    function issueCard(issue) {
      const card = node("article", "issue-card");
      const head = node("div", "issue-head");
      const title = node("div", "issue-title");
      title.append(
        node("span", "", `第 ${issue.line_no} 行`),
        node("span", "tag", issue.waybill_no),
        node("span", "tag fail", issue.label),
        node("span", "tag", issue.policy.id)
      );
      head.append(title, node("span", "issue-delta", money(issue.delta, true)));
      const explain = node("p", "issue-explain", issue.explain);
      const amounts = node("div", "amount-line");
      const charged = node("span", "", "账单金额 ");
      charged.append(node("strong", "", money(issue.charged)));
      const expected = node("span", "", "应收金额 ");
      expected.append(node("strong", "", money(issue.expected)));
      amounts.append(charged, expected);
      if (issue.rule_version) amounts.append(node("span", "", issue.rule_version));
      const details = node("details");
      details.append(node("summary", "", "查看复算过程"));
      const steps = node("ol", "steps");
      issue.steps.forEach((step) => steps.append(node("li", "", step)));
      details.append(steps);
      card.append(head, explain, amounts, details);
      return card;
    }

    function policySection(result) {
      const section = node("section", "content-section");
      section.append(node("h3", "", "制度依据"));
      result.citations.forEach((policy) => {
        const card = node("article", "policy-card");
        card.append(node("strong", "", `${policy.id} · ${policy.title}`), node("p", "", policy.text));
        section.append(card);
      });
      return section;
    }

    function allRowsSection(result) {
      const section = node("section", "content-section");
      const details = node("details");
      details.append(node("summary", "", `查看全部 ${result.checked_lines} 行核对明细`));
      const table = node("table", "all-rows");
      const thead = node("thead");
      const header = node("tr");
      ["行", "运单号", "账单金额", "应收金额", "差额"].forEach((label) => header.append(node("th", "", label)));
      thead.append(header);
      const tbody = node("tbody");
      const rowsByLine = new Map(result.rows.map((row) => [row.line_no, row]));
      const issuesByLine = new Map(result.issues.map((issue) => [issue.line_no, issue]));
      const lineNumbers = [...new Set([...rowsByLine.keys(), ...issuesByLine.keys()])].sort((a, b) => a - b);
      lineNumbers.forEach((lineNo) => {
        const row = rowsByLine.get(lineNo) || issuesByLine.get(lineNo);
        const tr = node("tr");
        [row.line_no, row.waybill_no, money(row.charged), money(row.expected), money(row.delta, true)]
          .forEach((value) => tr.append(node("td", "", value)));
        tbody.append(tr);
      });
      table.append(thead, tbody);
      details.append(table);
      section.append(details);
      return section;
    }

    async function doReviewAudit(billNo, decision) {
      try {
        const record = await api("/api/reviews/audit", {
          method: "POST",
          body: JSON.stringify({ bill_no: billNo, decision })
        });
        state.reviews[billNo] = record;
        renderAudit();
        toast(decision === "acknowledge" ? "差异已复核通过" : "差异已驳回");
      } catch (error) {
        toast(error.message, true);
      }
    }

    async function doConfirmEvidence(billNo, decision) {
      try {
        const record = await api("/api/reviews/evidence", {
          method: "POST",
          body: JSON.stringify({ bill_no: billNo, decision })
        });
        state.reviews[billNo] = record;
        renderAudit();
        toast(decision === "confirm" ? "证据审核已确认" : "证据审核已中止");
      } catch (error) {
        toast(error.message, true);
      }
    }

    function reviewFlow(result) {
      const section = node("section", "content-section");
      section.append(node("h3", "", "人工审核流程（三级确认）"));
      const review = state.reviews[result.bill_no] || { audit: null, evidence: null };
      const auditDone = !!(review.audit && review.audit.decision === "acknowledge");
      const evidenceDone = !!(review.evidence && review.evidence.decision === "confirm");
      const flow = node("div", "review-flow");

      const step1 = node("div", `review-step${review.audit ? " done" : ""}`);
      step1.append(node("span", "step-no", "①"));
      const body1 = node("div", "step-body");
      body1.append(node("div", "step-title", "差异复核"));
      body1.append(node("div", "step-meta", review.audit
        ? `${review.audit.reviewer} · ${review.audit.decision === "acknowledge" ? "已确认差异成立" : "已驳回"}`
        : "核对发现差异后，需人工确认差异是否成立"));
      step1.append(body1);
      if (!review.audit) {
        if (can("review:audit")) {
          const actions = node("div", "review-actions");
          const ok = node("button", "primary review-btn", "确认成立");
          ok.type = "button";
          ok.addEventListener("click", () => doReviewAudit(result.bill_no, "acknowledge"));
          const reject = node("button", "secondary review-btn", "驳回");
          reject.type = "button";
          reject.addEventListener("click", () => doReviewAudit(result.bill_no, "reject"));
          actions.append(ok, reject);
          step1.append(actions);
        } else {
          step1.append(node("div", "step-meta muted-hint", "需对账专员（唐映秋）复核"));
        }
      }
      flow.append(step1);

      const step2 = node("div", `review-step${review.evidence ? " done" : ""}`);
      step2.append(node("span", "step-no", "②"));
      const body2 = node("div", "step-body");
      body2.append(node("div", "step-title", "证据审核"));
      body2.append(node("div", "step-meta", review.evidence
        ? `${review.evidence.reviewer} · ${review.evidence.decision === "confirm" ? "已确认" : "已中止"}`
        : "确认证据齐备，或已知缺证仍继续"));
      step2.append(body2);
      if (auditDone && !review.evidence) {
        if (can("review:evidence")) {
          const actions = node("div", "review-actions");
          const ok = node("button", "primary review-btn", "确认");
          ok.type = "button";
          ok.addEventListener("click", () => doConfirmEvidence(result.bill_no, "confirm"));
          const abort = node("button", "secondary review-btn", "中止");
          abort.type = "button";
          abort.addEventListener("click", () => doConfirmEvidence(result.bill_no, "abort"));
          actions.append(ok, abort);
          step2.append(actions);
        } else {
          step2.append(node("div", "step-meta muted-hint", "需合同审计专员（傅景）审核"));
        }
      } else if (!auditDone) {
        step2.append(node("div", "step-meta muted-hint", "请先完成①差异复核"));
      }
      flow.append(step2);

      const step3 = node("div", "review-step");
      step3.append(node("span", "step-no", "③"));
      const body3 = node("div", "step-body");
      body3.append(node("div", "step-title", "争议终审"));
      body3.append(node("div", "step-meta", "生成争议草稿后，在弹窗中最终确认或取消"));
      step3.append(body3);
      flow.append(step3);

      section.append(flow);

      if (auditDone && evidenceDone) {
        const wrap = node("div", "draft-cta");
        if (can("draft:create")) {
          const button = node("button", "primary", "生成争议单");
          button.type = "button";
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              const draft = await api("/api/drafts", {
                method: "POST",
                body: JSON.stringify({ bill_no: result.bill_no })
              });
              upsertDraft(draft);
              openDraft(draft);
            } catch (error) {
              toast(error.message, true);
            } finally {
              button.disabled = false;
            }
          });
          wrap.append(button);
        } else {
          wrap.append(node("div", "step-meta muted-hint", "需对账专员（唐映秋）生成争议单"));
        }
        section.append(wrap);
      }
      return section;
    }

    function renderAudit() {
      const result = state.audit;
      const panel = byId("auditPanel");
      panel.replaceChildren();
      if (!result) {
        panel.append(node("div", "loading", "请选择左侧账单"));
        return;
      }
      const heading = node("div", "bill-heading");
      const identity = node("div");
      identity.append(
        node("p", "eyebrow", `${result.carrier} · ${result.period} 账期`),
        node("h2", "", result.bill_no),
        node("p", "subline", `出账日期 ${result.issued_at} · 共 ${result.checked_lines} 行`)
      );
      const total = node("div", "charged-total");
      total.append(node("span", "", "账单总额"), node("strong", "", money(result.charged_total)));
      heading.append(identity, total);
      panel.append(heading);

      const verdict = node("section", `verdict ${result.verdict}`);
      const line = node("div", "verdict-line");
      const textWrap = node("div");
      textWrap.append(node("div", "verdict-title", `${result.verdict_label}，发现 ${result.issues.length} 处差异`));
      const delta = node("div", "delta");
      delta.append(node("small", "", "合计多收金额"), document.createTextNode(money(result.total_delta, true)));
      line.append(textWrap, delta);
      verdict.append(line, node("p", "", `${result.summary} 金额已按合同价目与运单事实逐行复算。`));
      panel.append(verdict);
      if (result.verdict === "fail") {
        panel.append(reviewFlow(result));
      }

      const issueSection = node("section", "content-section");
      issueSection.append(node("h3", "", result.issues.length ? "差异明细" : "核对结论"));
      if (result.issues.length) {
        result.issues.forEach((issue) => issueSection.append(issueCard(issue)));
      } else {
        issueSection.append(node("p", "issue-explain", "所有计费行的账单金额与确定性复算结果一致。"));
      }
      panel.append(issueSection, allRowsSection(result), policySection(result));
      panel.scrollTop = 0;
    }

    async function selectBill(billNo) {
      state.current = billNo;
      renderBills();
      byId("auditPanel").replaceChildren(node("div", "loading", "正在逐行复算…"));
      try {
        state.audit = state.audits[billNo] || await api("/api/audit", {
          method: "POST",
          body: JSON.stringify({ bill_no: billNo })
        });
        state.audits[billNo] = state.audit;
        state.reviews[billNo] = await api(`/api/reviews/${encodeURIComponent(billNo)}`);
        renderAudit();
        resetConversation();
      } catch (error) {
        byId("auditPanel").replaceChildren(node("div", "loading", error.message));
        toast(error.message, true);
      }
    }

    function appendMessage(role, text, citations = []) {
      const message = node("div", `message ${role}`, text);
      if (citations.length) {
        const list = node("div", "citations");
        citations.forEach((policy) => {
          const chip = node("span", "citation", `${policy.id} ${policy.title}`);
          chip.title = policy.text;
          list.append(chip);
        });
        message.append(list);
      }
      byId("messages").append(message);
      message.scrollIntoView({ block: "nearest", behavior: "smooth" });
      return message;
    }

    function resetConversation() {
      byId("messages").replaceChildren();
      const result = state.audit;
      appendMessage("assistant", result ?
        `已载入 ${result.bill_no}。你可以追问差额原因、争议额度或称重单规则，我会同时给出制度出处。` :
        "请先选择一张账单。");
      const quick = byId("quickList");
      quick.replaceChildren();
      const questions = [
        result && result.verdict === "fail" ? "为什么这张账单多了钱？" : "这张账单的核对结果怎么样？",
        "争议额度还剩多少？",
        "称重单要满足什么条件？"
      ];
      questions.forEach((question) => {
        const button = node("button", "quick", question);
        button.type = "button";
        button.addEventListener("click", () => ask(question));
        quick.append(button);
      });
    }

    let asking = false;
    async function ask(question) {
      const query = (question || "").trim();
      if (!query || asking) return;
      if (!state.current) {
        toast("请先选择账单", true);
        return;
      }
      asking = true;
      byId("askButton").disabled = true;
      byId("questionInput").value = "";
      appendMessage("user", query);
      const pending = appendMessage("assistant", "正在检索制度并核对账单事实…");
      try {
        const result = await api("/api/answer", {
          method: "POST",
          body: JSON.stringify({ question: query, bill_no: state.current })
        });
        pending.replaceWith(appendMessage("assistant", result.answer, result.citations));
      } catch (error) {
        pending.replaceWith(appendMessage("assistant", `查询失败：${error.message}`));
      } finally {
        asking = false;
        byId("askButton").disabled = false;
        byId("questionInput").focus();
      }
    }

    function upsertDraft(draft) {
      const index = state.drafts.findIndex((item) => item.draft_id === draft.draft_id);
      if (index >= 0) state.drafts.splice(index, 1);
      state.drafts.unshift(draft);
      renderDrafts();
    }

    function openDraft(draft) {
      state.activeDraft = draft;
      byId("draftDialogMeta").textContent = `${draft.draft_id} · ${draft.bill_no}`;
      byId("draftAmount").textContent = money(draft.amount);
      byId("draftBody").textContent = draft.body;
      const status = byId("draftStatus");
      status.replaceChildren(node("span", `tag ${draft.status}`, statusLabel(draft.status)));
      status.style.marginBottom = "12px";
      const pending = draft.status === "pending";
      const canDecide = can("draft:decide");
      if (pending && canDecide) {
        byId("confirmDraft").hidden = false;
        byId("confirmDraft").disabled = false;
        byId("cancelDraft").textContent = "取消草稿";
        byId("cancelDraft").disabled = false;
      } else {
        byId("confirmDraft").hidden = true;
        byId("cancelDraft").textContent = "关闭";
        byId("cancelDraft").disabled = false;
        if (pending) {
          status.append(node("div", "step-meta muted-hint", "当前角色无终审权限，需结算经理（顾明岚）确认"));
        }
      }
      byId("draftDialog").showModal();
    }

    async function decideActive(action) {
      const draft = state.activeDraft;
      if (!draft) return;
      if (draft.status !== "pending" || !can("draft:decide")) {
        byId("draftDialog").close();
        return;
      }
      byId("confirmDraft").disabled = true;
      byId("cancelDraft").disabled = true;
      try {
        const decided = await api(`/api/drafts/${encodeURIComponent(draft.draft_id)}/decision`, {
          method: "POST",
          body: JSON.stringify({ action })
        });
        upsertDraft(decided);
        state.activeDraft = decided;
        byId("draftDialog").close();
        toast(action === "confirm" ? "已确认，草稿进入演示复核队列" : "草稿已取消");
      } catch (error) {
        toast(error.message, true);
        byId("confirmDraft").disabled = false;
        byId("cancelDraft").disabled = false;
      }
    }

    byId("askForm").addEventListener("submit", (event) => {
      event.preventDefault();
      ask(byId("questionInput").value);
    });
    byId("confirmDraft").addEventListener("click", () => decideActive("confirm"));
    byId("cancelDraft").addEventListener("click", () => decideActive("cancel"));
    byId("dialogClose").addEventListener("click", () => byId("draftDialog").close());
    byId("draftDialog").addEventListener("click", (event) => {
      if (event.target === byId("draftDialog")) byId("draftDialog").close();
    });

    async function bootstrap() {
      try {
        const [billData, draftData] = await Promise.all([
          api("/api/bills"),
          api("/api/drafts")
        ]);
        state.bills = billData.items;
        state.drafts = draftData.items;
        renderBills();
        renderDrafts();
        resetConversation();
        await Promise.all(state.bills.map(async (bill) => {
          state.audits[bill.bill_no] = await api("/api/audit", {
            method: "POST",
            body: JSON.stringify({ bill_no: bill.bill_no })
          });
        }));
        renderBills();
        if (state.bills.length) await selectBill(state.bills[0].bill_no);
      } catch (error) {
        byId("billList").replaceChildren(node("div", "empty", "账单加载失败"));
        byId("auditPanel").replaceChildren(node("div", "loading", error.message));
        toast(error.message, true);
      }
    }

    // —— 登录 / 退出 ——

    function showLogin() {
      byId("loginScreen").hidden = false;
      byId("workspace").hidden = true;
    }

    function showApp() {
      byId("loginScreen").hidden = true;
      byId("workspace").hidden = false;
    }

    function renderUser() {
      if (!state.user) return;
      byId("userName").textContent = state.user.name;
      byId("userRole").textContent = `${state.user.role_label} · ${state.user.username}`;
      byId("logoutBtn").hidden = false;
    }

    async function doLogin(username, password) {
      const loginButton = byId("loginButton");
      loginButton.disabled = true;
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username.trim(), password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.token) {
          throw new Error(data.detail || data.message || "登录失败");
        }
        state.token = data.token;
        state.user = data.user;
        renderUser();
        byId("loginError").hidden = true;
        showApp();
        await bootstrap();
      } catch (error) {
        byId("loginError").textContent = error.message;
        byId("loginError").hidden = false;
      } finally {
        loginButton.disabled = false;
      }
    }

    function doLogout(showLoginAfter = true) {
      if (state.token) {
        fetch("/api/logout", {
          method: "POST",
          headers: { "Authorization": "Bearer " + state.token }
        }).catch(() => {});
      }
      state.token = null;
      state.user = null;
      state.bills = [];
      state.drafts = [];
      state.audits = {};
      state.reviews = {};
      state.current = null;
      state.audit = null;
      byId("logoutBtn").hidden = true;
      byId("userName").textContent = "未登录";
      byId("userRole").textContent = "";
      if (showLoginAfter) showLogin();
    }

    async function initLogin() {
      try {
        const data = await fetch("/api/accounts").then((r) => r.json());
        const chips = byId("accountChips");
        chips.replaceChildren();
        data.accounts.forEach((account) => {
          const button = node("button", "account-chip");
          button.type = "button";
          button.append(
            node("strong", "", account.name),
            node("small", "", `${account.role_label} · ${account.username}`)
          );
          button.title = account.permissions.join("、");
          button.addEventListener("click", () => {
            byId("loginUser").value = account.username;
            byId("loginPass").value = data.demo_password;
            doLogin(account.username, data.demo_password);
          });
          chips.append(button);
        });
      } catch (error) {
        // 账号清单加载失败不影响手工登录
      }
      byId("loginForm").addEventListener("submit", (event) => {
        event.preventDefault();
        doLogin(byId("loginUser").value, byId("loginPass").value);
      });
      byId("logoutBtn").addEventListener("click", () => doLogout(true));
      showLogin();
    }

    initLogin();
  </script>
</body>
</html>
